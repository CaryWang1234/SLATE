name: Build macOS Installer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.3.6)'
        required: true
        default: '0.3.6'

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Homebrew dependencies
        run: |
          brew install create-dmg --quiet || true

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep '#define MyAppVersion' SLATE_InnoSetup.iss | sed 's/.*"\(.*\)".*/\1/')
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build macOS installer
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh ${{ steps.version.outputs.version }}

      - name: Verify outputs
        run: |
          ls -lh dist/macos/*.dmg
          cat dist/macos/*.sha256

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLATE-macOS-${{ steps.version.outputs.version }}
          path: dist/macos/SLATE-Setup-*.dmg
          retention-days: 90

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: SLATE-macOS-${{ steps.version.outputs.version }}-checksum
          path: dist/macos/SLATE-Setup-*.dmg.sha256
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/SLATE-Setup-*.dmg
            dist/macos/SLATE-Setup-*.dmg.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
