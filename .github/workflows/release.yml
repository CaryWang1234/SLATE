name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build desktop package (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean SLATE.spec

      # 与 build_desktop.bat 保持一致：补齐 data 目录
      - name: Prepare data directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\SLATE\data\skills | Out-Null
          if (Test-Path data\constitution.json) { Copy-Item data\constitution.json dist\SLATE\data\ -Force }
          if (Test-Path data\skills\.gitkeep) { Copy-Item data\skills\.gitkeep dist\SLATE\data\skills\ -Force }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (ISCC)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc.FullName "SLATE_InnoSetup.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLATE-installer
          path: installer/*.exe
          if-no-files-found: error

      # 打 tag 触发时自动附到 Release；手动触发时只产出 artifact
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
          generate_release_notes: true